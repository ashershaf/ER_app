<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Quick Notes</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    line-height: 1.5;
}

header {
    background: #1a1a2e;
    color: white;
    padding: 1rem 2rem;
    text-align: center;
}

header h1 {
    font-size: 1.5rem;
    font-weight: 700;
}

.subtitle {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-top: 0.25rem;
}

main {
    max-width: 900px;
    margin: 1.5rem auto;
    padding: 0 1rem;
}

h2 {
    font-size: 1.1rem;
    margin-bottom: 1rem;
    color: #1a1a2e;
}

.hidden {
    display: none !important;
}

/* ---- Chief Complaint Grid ---- */
.complaint-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0.5rem;
}

.complaint-btn {
    padding: 0.7rem 1rem;
    border: 2px solid #d0d5dd;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    text-align: left;
    transition: all 0.15s;
}

.complaint-btn:hover {
    border-color: #2563eb;
    background: #eff6ff;
}

.complaint-btn .emoji {
    margin-right: 0.4rem;
}

/* ---- Selected Complaint Bar ---- */
.selected-complaint-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1a1a2e;
    color: white;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-weight: 600;
    font-size: 1rem;
}

.btn-small {
    padding: 0.3rem 0.8rem;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 0.8rem;
}

.btn-small:hover {
    background: rgba(255,255,255,0.1);
}

/* ---- Context Box ---- */
.context-box {
    margin-bottom: 1rem;
}

.context-box label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
    color: #475467;
}

.context-box input {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border: 1.5px solid #d0d5dd;
    border-radius: 6px;
    font-size: 0.9rem;
}

.context-box input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

/* ---- Question Panels (Accordion) ---- */
.panel {
    background: white;
    border: 1.5px solid #e4e7ec;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    overflow: hidden;
}

.panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 1rem;
    cursor: pointer;
    user-select: none;
    font-weight: 600;
    font-size: 0.9rem;
    background: #f9fafb;
    border-bottom: 1px solid transparent;
}

.panel-header:hover {
    background: #f0f4ff;
}

.panel-header .arrow {
    transition: transform 0.2s;
    font-size: 0.7rem;
    color: #98a2b3;
}

.panel.open .panel-header {
    border-bottom-color: #e4e7ec;
}

.panel.open .panel-header .arrow {
    transform: rotate(90deg);
}

.panel-body {
    display: none;
    padding: 0.6rem 1rem;
}

.panel.open .panel-body {
    display: block;
}

/* ---- Question Rows ---- */
.question-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.45rem 0;
    border-bottom: 1px solid #f2f4f7;
    gap: 0.5rem;
}

.question-row:last-child {
    border-bottom: none;
}

.question-row.sub-question {
    padding-left: 1.2rem;
    font-size: 0.85rem;
    color: #475467;
}

.question-label {
    flex: 1;
    font-size: 0.88rem;
}

/* ---- Toggle Switch ---- */
.toggle-group {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
}

.toggle-group button {
    padding: 0.2rem 0.55rem;
    border: 1.5px solid #d0d5dd;
    background: white;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 600;
    color: #667085;
    transition: all 0.12s;
}

.toggle-group button:first-child {
    border-radius: 4px 0 0 4px;
}

.toggle-group button:last-child {
    border-radius: 0 4px 4px 0;
}

.toggle-group button.active-yes {
    background: #dcfce7;
    border-color: #16a34a;
    color: #15803d;
}

.toggle-group button.active-no {
    background: #fef2f2;
    border-color: #dc2626;
    color: #dc2626;
}

/* ---- Free text input within questions ---- */
.inline-input {
    width: 140px;
    padding: 0.2rem 0.5rem;
    border: 1.5px solid #d0d5dd;
    border-radius: 4px;
    font-size: 0.82rem;
    flex-shrink: 0;
}

.inline-input:focus {
    outline: none;
    border-color: #2563eb;
}

/* Select dropdown */
.inline-select {
    padding: 0.2rem 0.4rem;
    border: 1.5px solid #d0d5dd;
    border-radius: 4px;
    font-size: 0.82rem;
    background: white;
    flex-shrink: 0;
}

/* ---- Multi-select chips ---- */
.chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    flex-shrink: 0;
}

.chip {
    padding: 0.2rem 0.5rem;
    border: 1.5px solid #d0d5dd;
    border-radius: 12px;
    background: white;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 500;
    color: #667085;
    transition: all 0.12s;
}

.chip.active {
    background: #dbeafe;
    border-color: #2563eb;
    color: #1d4ed8;
}

/* ---- Buttons ---- */
.action-bar {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.5rem;
    margin-bottom: 2rem;
}

.btn-primary {
    padding: 0.7rem 1.5rem;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    padding: 0.7rem 1.5rem;
    background: white;
    color: #344054;
    border: 1.5px solid #d0d5dd;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
}

.btn-secondary:hover {
    background: #f9fafb;
}

/* ---- Note Output ---- */
.note-output {
    background: white;
    border: 1.5px solid #e4e7ec;
    border-radius: 8px;
    padding: 1.2rem 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.9rem;
    line-height: 1.7;
    min-height: 200px;
}

/* ---- Toast notification ---- */
.toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a2e;
    color: white;
    padding: 0.6rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    z-index: 1000;
    animation: fadeInOut 2s ease;
}

@keyframes fadeInOut {
    0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    85% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
}

/* ---- Responsive ---- */
@media (max-width: 600px) {
    .complaint-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .question-row {
        flex-wrap: wrap;
    }

    .toggle-group, .chip-group, .inline-input {
        margin-top: 0.3rem;
    }
}

<body>
    <header>
        <h1>ER Quick Notes</h1>
        <p class="subtitle">Rapid clinical documentation for emergency physicians</p>
    </header>

    <main>
        <!-- Step 1: Chief Complaint Selection -->
        <section id="complaint-section">

        </section>

                <button id="change-complaint-btn" class="btn-small">Change</button>
            </div>

            <!-- Free text for onset/context -->
            <div class="context-box">
                <label for="context-input">Brief context (age/sex, onset, duration):</label>
                <input type="text" id="context-input" placeholder='e.g. "45M, sudden onset 2hrs ago, at rest"'>
            </div>

            <div id="question-panels"></div>

            <div class="action-bar">
                <button id="generate-note-btn" class="btn-primary">Generate Note</button>
                <button id="clear-all-btn" class="btn-secondary">Clear All</button>
            </div>
        </section>

        <!-- Step 3: Generated Note -->
        <section id="note-section" class="hidden">
            <h2>Generated Note</h2>
            <div id="note-output" class="note-output"></div>
            <div class="action-bar">
                <button id="copy-note-btn" class="btn-primary">Copy to Clipboard</button>
                <button id="edit-questions-btn" class="btn-secondary">Back to Questions</button>
            </div>
        </section>
    </main>

// ============================================================
// app.js — Application logic (inline)
// ============================================================
(function () {
    "use strict";

    var currentComplaint = null;
    var answers = {};

    var complaintGrid = document.getElementById("complaint-grid");
    var complaintSection = document.getElementById("complaint-section");
    var questionsSection = document.getElementById("questions-section");
    var noteSection = document.getElementById("note-section");
    var selectedComplaintLabel = document.getElementById("selected-complaint-label");
    var changeComplaintBtn = document.getElementById("change-complaint-btn");
    var contextInput = document.getElementById("context-input");
    var questionPanels = document.getElementById("question-panels");
    var generateNoteBtn = document.getElementById("generate-note-btn");
    var clearAllBtn = document.getElementById("clear-all-btn");
    var noteOutput = document.getElementById("note-output");
    var copyNoteBtn = document.getElementById("copy-note-btn");
    var editQuestionsBtn = document.getElementById("edit-questions-btn");

    function renderComplaintGrid() {
        complaintGrid.innerHTML = "";
        COMPLAINTS.forEach(function (c) {
            var btn = document.createElement("button");
            btn.className = "complaint-btn";
            btn.innerHTML = '<span class="emoji">' + c.emoji + "</span>" + c.name;
            btn.addEventListener("click", function () {
                selectComplaint(c);
            });
            complaintGrid.appendChild(btn);
        });
    }

    function selectComplaint(complaint) {
        currentComplaint = complaint;
        Object.keys(answers).forEach(function (k) { delete answers[k]; });
        contextInput.value = "";
        selectedComplaintLabel.textContent = complaint.emoji + " " + complaint.name;
        complaintSection.classList.add("hidden");
        noteSection.classList.add("hidden");
        questionsSection.classList.remove("hidden");
        renderPanels();
    }

    changeComplaintBtn.addEventListener("click", function () {
        questionsSection.classList.add("hidden");
        noteSection.classList.add("hidden");
        complaintSection.classList.remove("hidden");
    });

    function renderPanels() {
        questionPanels.innerHTML = "";
        currentComplaint.sections.forEach(function (section, idx) {
            var panel = document.createElement("div");
            panel.className = "panel" + (idx === 0 ? " open" : "");

            var header = document.createElement("div");
            header.className = "panel-header";
            header.innerHTML = "<span>" + section.title + "</span><span class='arrow'>&#9654;</span>";
            header.addEventListener("click", function () {
                panel.classList.toggle("open");
            });

            var body = document.createElement("div");
            body.className = "panel-body";

            section.questions.forEach(function (q) {
                renderQuestion(body, q, false);
            });

            panel.appendChild(header);
            panel.appendChild(body);
            questionPanels.appendChild(panel);
        });
    }

    function renderQuestion(container, q, isSub) {
        var row = document.createElement("div");
        row.className = "question-row" + (isSub ? " sub-question" : "");
        row.dataset.questionId = q.id;

        var label = document.createElement("span");
        label.className = "question-label";
        label.textContent = q.label;
        row.appendChild(label);

        if (q.type === "yesno") {
            row.appendChild(createToggle(q));
        } else if (q.type === "text") {
            row.appendChild(createTextInput(q));
        } else if (q.type === "select") {
            row.appendChild(createSelect(q));
        } else if (q.type === "chips") {
            row.appendChild(createChips(q));
        }

        container.appendChild(row);

        if (q.sub && q.sub.length > 0) {
            var subContainer = document.createElement("div");
            subContainer.className = "sub-container hidden";
            subContainer.dataset.parentId = q.id;
            q.sub.forEach(function (sq) {
                renderQuestion(subContainer, sq, true);
            });
            container.appendChild(subContainer);
        }
    }

    function createToggle(q) {
        var group = document.createElement("div");
        group.className = "toggle-group";

        var yesBtn = document.createElement("button");
        yesBtn.textContent = "Yes";
        yesBtn.type = "button";
        var noBtn = document.createElement("button");
        noBtn.textContent = "No";
        noBtn.type = "button";

        function update(val) {
            answers[q.id] = val;
            yesBtn.className = val === true ? "active-yes" : "";
            noBtn.className = val === false ? "active-no" : "";

            var subContainer = group.parentElement.parentElement.querySelector(
                '[data-parent-id="' + q.id + '"]'
            );
            if (subContainer) {
                if (val === true) {
                    subContainer.classList.remove("hidden");
                } else {
                    subContainer.classList.add("hidden");
                    if (q.sub) {
                        q.sub.forEach(function (sq) { delete answers[sq.id]; });
                    }
                }
            }
        }

        yesBtn.addEventListener("click", function () { update(answers[q.id] === true ? undefined : true); });
        noBtn.addEventListener("click", function () { update(answers[q.id] === false ? undefined : false); });

        group.appendChild(yesBtn);
        group.appendChild(noBtn);
        return group;
    }

    function createTextInput(q) {
        var input = document.createElement("input");
        input.type = "text";
        input.className = "inline-input";
        input.placeholder = q.placeholder || "";
        input.addEventListener("input", function () {
            answers[q.id] = input.value.trim() || undefined;
        });
        return input;
    }

    function createSelect(q) {
        var select = document.createElement("select");
        select.className = "inline-select";
        var def = document.createElement("option");
        def.value = "";
        def.textContent = "\u2014";
        select.appendChild(def);
        q.options.forEach(function (o) {
            var opt = document.createElement("option");
            opt.value = o;
            opt.textContent = o;
            select.appendChild(opt);
        });
        select.addEventListener("change", function () {
            answers[q.id] = select.value || undefined;
        });
        return select;
    }

    function createChips(q) {
        var group = document.createElement("div");
        group.className = "chip-group";
        if (!answers[q.id]) answers[q.id] = [];
        q.options.forEach(function (o) {
            var chip = document.createElement("button");
            chip.className = "chip";
            chip.type = "button";
            chip.textContent = o;
            chip.addEventListener("click", function () {
                var arr = answers[q.id] || [];
                var idx = arr.indexOf(o);
                if (idx >= 0) {
                    arr.splice(idx, 1);
                    chip.classList.remove("active");
                } else {
                    arr.push(o);
                    chip.classList.add("active");
                }
                answers[q.id] = arr.length > 0 ? arr : undefined;
            });
            group.appendChild(chip);
        });
        return group;
    }

    generateNoteBtn.addEventListener("click", function () {
        var note = buildNote();
        noteOutput.textContent = note;
        noteSection.classList.remove("hidden");
        questionsSection.classList.add("hidden");
    });

    editQuestionsBtn.addEventListener("click", function () {
        noteSection.classList.add("hidden");
        questionsSection.classList.remove("hidden");
    });

    clearAllBtn.addEventListener("click", function () {
        Object.keys(answers).forEach(function (k) { delete answers[k]; });
        contextInput.value = "";
        renderPanels();
    });

    copyNoteBtn.addEventListener("click", function () {
        navigator.clipboard.writeText(noteOutput.textContent).then(function () {
            showToast("Copied to clipboard");
        });
    });

    function showToast(msg) {
        var toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(function () { toast.remove(); }, 2100);
    }

    function buildNote() {
        var lines = [];

        // CC line
        lines.push("CC: " + currentComplaint.name);
        lines.push("");

        // Opening line
        var intro = "";
        if (contextInput.value.trim()) {
            intro = contextInput.value.trim() + ", presenting with " + currentComplaint.name.toLowerCase() + ".";
        } else {
            intro = "Patient presents with " + currentComplaint.name.toLowerCase() + ".";
        }
        lines.push(intro);

        // Each section becomes a narrative paragraph
        currentComplaint.sections.forEach(function (section) {
            var text = buildSectionNarrative(section);
            if (text) {
                lines.push("");
                lines.push(text);
            }
        });

        return lines.join("\n").trim();
    }

    function buildSectionNarrative(section) {
        var descriptors = [];
        var positives = [];
        var negatives = [];

        section.questions.forEach(function (q) {
            var val = answers[q.id];
            var label = q.noteLabel || q.label;

            if (q.type === "chips") {
                if (Array.isArray(val) && val.length > 0) {
                    descriptors.push(label + ": " + val.join(", "));
                }
            } else if (q.type === "text") {
                if (typeof val === "string" && val) {
                    descriptors.push(label + ": " + val);
                }
            } else if (q.type === "select") {
                if (val) {
                    var cleanLabel = label.replace(/\s*\(1-10\)/, "");
                    descriptors.push(cleanLabel + " " + val + "/10");
                }
            } else if (q.type === "yesno") {
                if (val === true) {
                    var detail = label;
                    // Append sub-question details
                    if (q.sub) {
                        var subParts = [];
                        q.sub.forEach(function (sq) {
                            var sv = answers[sq.id];
                            if (sv === undefined || sv === null) return;
                            var sLabel = sq.noteLabel || sq.label;
                            if (sv === true) {
                                subParts.push(sLabel.toLowerCase());
                            } else if (Array.isArray(sv) && sv.length > 0) {
                                subParts.push(sv.join(", "));
                            } else if (typeof sv === "string" && sv) {
                                subParts.push(sLabel + ": " + sv);
                            }
                        });
                        if (subParts.length > 0) {
                            detail += " (" + subParts.join("; ") + ")";
                        }
                    }
                    positives.push(detail);
                } else {
                    // Explicitly "No" OR unanswered — symptom not present
                    negatives.push(cleanForNote(label));
                }
            }
        });

        // Build the narrative
        var sentences = [];

        if (descriptors.length > 0) {
            sentences.push(descriptors.join(". ") + ".");
        }
        if (positives.length > 0) {
            sentences.push(positives.join(". ") + ".");
        }
        if (negatives.length > 0) {
            sentences.push("No " + formatNoteList(negatives) + ".");
        }

        return sentences.join(" ");
    }

    function cleanForNote(label) {
        return label
            .toLowerCase()
            .replace(/\s*\(.*?\)\s*/g, "")
            .replace(/\s+/g, " ")
            .trim();
    }

    function formatNoteList(items) {
        if (items.length === 0) return "";
        if (items.length === 1) return items[0];
        if (items.length === 2) return items[0] + " or " + items[1];
        return items.slice(0, -1).join(", ") + ", or " + items[items.length - 1];
    }

    renderComplaintGrid();
})();
    </script>
